name: site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # A required check, by this exact name: the site builds strictly on every
  # pull request, so a broken link or a dangling embed blocks the merge.
  # --strict matters — without it a broken link is a warning and the build
  # exits 0 (spec probe P18).
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: zensical build --strict
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Publishes what `docs` built — only from main, never from a pull request.
  deploy:
    if: github.event_name == 'push'
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

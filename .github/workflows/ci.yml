name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Each job id is the check name a ruleset requires, by that exact string. No
# matrices: a matrix appends its value to the check name and silently disarms
# the requirement. One Go version — the floor IS the latest release (spec D10).
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - uses: golangci/golangci-lint-action@v9
        with:
          # Must be built with Go >= the go directive, or it refuses the config.
          version: v2.14.0
      - name: Workflows are valid (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      # Raced and shuffled: the gate's own fixture tests need -race to run at
      # all, and skip (loudly) without it.
      - run: go test -race -shuffle=on ./...
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      # Built, not `go run`: go run turns every non-zero exit into 1.
      - run: go build -o bin/gate ./internal/cmd/gate
      - name: Generated index pages are up to date
        run: bin/gate gen -check
      - run: bin/gate check

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./...
